[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thetree-server"
version = "0.8.0"
description = "Backend for The Tree: Idle Tower Defense (FastAPI + SQLAlchemy 2 async)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
    "SQLAlchemy==2.0.51",
    "aiosqlite==0.22.1",
    "asyncpg==0.31.0",
    "alembic==1.20.1",
    "tzdata==2026.6",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "httpx==0.28.1",
]
dev = [
    "thetree-server[test]",
    "ruff==0.15.12",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
